<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lessonlab</title>
<link rel="icon" href="lessonlab.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
 background:radial-gradient(900px 500px at 15% 0%,#e6dcff 0,transparent 60%),radial-gradient(800px 500px at 100% 100%,#d9ecff 0,transparent 55%),#f4f1fb;
 font-family:'Outfit',system-ui,Segoe UI,Arial,sans-serif;color:#2a2347}
.card{background:#fff;border:1px solid #e4def5;border-radius:24px;padding:40px 34px 34px;box-shadow:0 18px 50px rgba(95,70,180,.14);text-align:center;width:min(400px,100%)}
.logo{width:72px;height:72px;margin:0 auto 14px;display:block}
h1{margin:0;font-size:2.3rem;font-weight:700;letter-spacing:-.02em}
h1 .a{color:#7d68d0}h1 .b{color:#a68ce6}
.sub{margin:6px 0 28px;color:#7a7396;font-size:1rem}
.opt{display:flex;align-items:center;gap:16px;text-align:left;padding:16px 18px;margin:12px 0;border-radius:16px;text-decoration:none;border:1.5px solid transparent;transition:transform .15s,box-shadow .15s}
.opt:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(95,70,180,.2)}
.opt:focus-visible{outline:3px solid #b9a6f0;outline-offset:2px}
.ico{flex:none;width:48px;height:48px;border-radius:13px;display:grid;place-items:center}
.ico svg{width:28px;height:28px}
.t strong{display:block;font-size:1.15rem;font-weight:600}
.t span{font-size:.88rem;opacity:.85}
.stu{background:#7d68d0;color:#fff}.stu .ico{background:rgba(255,255,255,.2)}
.tea{background:#f1ecfd;color:#3f3182;border-color:#dcd2f7}.tea .ico{background:#fff}
.lab{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:13px 16px;border-radius:14px;border:1.5px dashed #b9a6f0;background:#fff;color:#6d58c2;font-weight:700;font-size:1.02rem;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}.lab:hover{background:#f7f3ff;transform:translateY(-2px);box-shadow:0 10px 24px rgba(95,70,180,.16)}.lab:focus-visible{outline:3px solid #b9a6f0;outline-offset:2px}

.xp-switch{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;padding:12px 16px;border-radius:16px;border:1.5px dashed #b9a6f0;background:#fff;color:#4a3d8f;cursor:pointer;text-align:left;user-select:none;transition:background .2s,border-color .2s}.xp-text{font-size:1.02rem;font-weight:700}
.xp-switch input{position:absolute;opacity:0;width:0;height:0}
.xp-switch .track{flex:none;width:46px;height:26px;border-radius:99px;background:#d9d2ee;position:relative;transition:background .25s}
.xp-switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(40,30,90,.3);transition:transform .25s}
.xp-switch input:checked+.track{background:linear-gradient(90deg,#ff5d8f,#ffb23f,#4cd98a,#3fb6ff,#8b6cff)}
.xp-switch input:checked+.track .knob{transform:translateX(20px)}
.xp-switch input:focus-visible+.track{outline:3px solid #b9a6f0;outline-offset:2px}

/* experiment mode on: a bit multicoloured */
body.xp-on{background:radial-gradient(700px 420px at 8% 0%,#ffd3e3 0,transparent 60%),radial-gradient(700px 420px at 100% 10%,#fff0b8 0,transparent 55%),radial-gradient(800px 500px at 90% 100%,#c9ecff 0,transparent 55%),radial-gradient(700px 450px at 0% 100%,#d4f5df 0,transparent 55%),#f6f1ff}
body.xp-on .card{border-color:transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(120deg,#ff5d8f,#ffb23f,#4cd98a,#3fb6ff,#8b6cff) border-box;border:2px solid transparent}
body.xp-on h1 .a{color:#ff5d8f}body.xp-on h1 .b{color:#3fb6ff}
body.xp-on .stu{background:linear-gradient(120deg,#8b6cff,#3fb6ff)}
body.xp-on .tea{background:linear-gradient(120deg,#fff3d6,#ffe0ec);color:#7a2c55;border-color:#ffd0a8}
body.xp-on .xp-switch{border-style:solid;border-color:#ffb23f;background:#fffaf0}
body.xp-on .foot{color:#8b6cff}
.foot{margin-top:22px;font-size:.8rem;color:#a39cc0}
</style></head><body>
<main class="card">
  <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lessonlab logo">
    <g transform="scale(.6667)"><rect width="96" height="96" rx="22" fill="#efebfc"/><g transform="translate(4.2 4.2) scale(.912)"><rect x="27" y="3" width="42" height="8" rx="4" fill="#7d68d0"/><path d="M33 9 H63 V34 L90 78 Q96 91 82 91 H14 Q0 91 6 78 L33 34 Z" fill="#7d68d0"/><g transform="translate(48 66) scale(.88) translate(-48 -63)"><path d="M32 63 V76 Q48 85 64 76 V63 L48 69 Z" fill="#efebfc"/><path d="M20 57 L48 45 L76 57 L48 69 Z" fill="#efebfc"/><path d="M25 59 V76" stroke="#efebfc" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="25" cy="79" r="3.5" fill="#efebfc"/></g><rect x="33" y="21" width="30" height="3" fill="#efebfc"/></g></g>
  </svg>
  <h1><span class="a">Lesson</span><span class="b">lab</span></h1>
  <p class="sub">Choose how you're joining</p>

  <a class="opt stu" id="go-student" href="student">
    <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.2V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.8"/><path d="M22 9v6"/></svg></span>
    <span class="t"><strong>Student</strong><span>Join with your class code</span></span>
  </a>
  <a class="opt tea" id="go-teacher" href="teacher">
    <span class="ico" style="color:#7d68d0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M12 16v4M8 20h8"/><path d="M7 12l3-3 2.5 2L17 8"/></svg></span>
    <span class="t"><strong>Teacher</strong><span>Run your class and booklet</span></span>
  </a>
  <label class="xp-switch" for="xp"><input type="checkbox" id="xp" role="switch"><span class="track"><span class="knob"></span></span><span class="xp-text">🧪 Experiment mode</span></label>
  <div class="foot">Lessonlab</div>
</main>
<script>
(function(){
var cb=document.getElementById('xp'),st=document.getElementById('go-student'),te=document.getElementById('go-teacher');
var ext=location.protocol==='file:'?'.html':'';
function apply(on){
  document.body.classList.toggle('xp-on',on);cb.checked=on;
  st.setAttribute('href',(on?'student-p2p':'student')+ext);
  te.setAttribute('href',(on?'teacher-p2p':'teacher')+ext);
}
var on=false;try{on=localStorage.getItem('ll_experiment')==='1'}catch(e){}
apply(on);
cb.addEventListener('change',function(){apply(cb.checked);try{localStorage.setItem('ll_experiment',cb.checked?'1':'0')}catch(e){}});
window.addEventListener('pageshow',function(){var v=false;try{v=localStorage.getItem('ll_experiment')==='1'}catch(e){}apply(v)});
})();
</script>
</body></html>
