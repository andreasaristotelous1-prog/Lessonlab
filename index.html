<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Classroom Booklet</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </style>
  <style>
    * { box-sizing: border-box; }
    body, html { margin: 0; padding: 0; height: 100%; font-family: -apple-system, sans-serif; background: #0f172a; color: white; overflow: hidden; }
    
    #join { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; padding: 1rem; }
    input, button { padding: 14px 20px; font-size: 1.1rem; border-radius: 8px; border: none; margin: 8px; width: 100%; max-width: 320px; }
    button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
    
    #viewer-container { display: none; flex-direction: column; height: 100vh; }
    
    .nav-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e293b; padding: 10px 16px; border-bottom: 1px solid #334155;
    }
    .status-pill {
      font-size: 0.85rem; padding: 4px 10px; border-radius: 20px; font-weight: 700;
    }
    .pill-locked { background: #334155; color: #94a3b8; }
    .pill-solo { background: #065f46; color: #34d399; }

    .nav-btns { display: none; gap: 8px; }
    .nav-btns button {
      width: auto; padding: 6px 12px; font-size: 0.9rem; background: #0284c7; color: white;
    }

    .canvas-scroll-area {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
      padding: 10px; background: #0b1120;
    }
    canvas { max-width: 100%; height: auto !important; box-shadow: 0 4px 20px rgba(0,0,0,0.4); border-radius: 4px; }

    #waiting-msg {
      margin-top: 40px; color: #94a3b8; font-size: 1.1rem; text-align: center;
    }

    #reward-banner {
      position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white; padding: 14px 26px; border-radius: 30px;
      font-size: 1.2rem; font-weight: 700; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div id="reward-banner">⭐ 9 Awarded! Keep it up!</div>

  <div id="join">
    <h2>Welcome to Class</h2>
    <input type="text" id="name" placeholder="Enter your full name">
    <button id="start-btn" onclick="joinClass()">Start Lesson</button>
  </div>

  <div id="viewer-container">
    <div class="nav-bar">
      <span id="mode-pill" class="status-pill pill-locked">🔒 Teacher Leading</span>
      <span id="page-info" style="font-weight: 600; font-size: 0.95rem;">No Booklet Loaded</span>
      <div id="solo-controls" class="nav-btns">
        <button onclick="studentChangePage(-1)">← Prev</button>
        <button onclick="studentChangePage(1)">Next →</button>
      </div>
    </div>
    <div class="canvas-scroll-area">
      <div id="waiting-msg">⏳ Waiting for teacher to broadcast a booklet...</div>
      <canvas id="student-canvas" style="display:none;"></canvas>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, update, onValue, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAa-5f4Tkiw840rV2B7WKTz7-1f-9YFJa0",
      authDomain: "classfocus.firebaseapp.com",
      databaseURL: "https://classfocus-default-rtdb.firebaseio.com",
      projectId: "classfocus",
      storageBucket: "classfocus.firebasestorage.app",
      messagingSenderId: "353877697764",
      appId: "1:353877697764:web:56d66de988624e4b82f8f1",
      measurementId: "G-K2N3N8J80Z"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let pdfDoc = null;
    let currentPage = 1;
    let isSoloWork = false;
    let pageRendering = false;
    let pageNumPending = null;

    const canvas = document.getElementById('student-canvas');
    const ctx = canvas.getContext('2d');
    const modePill = document.getElementById('mode-pill');
    const pageInfo = document.getElementById('page-info');
    const soloControls = document.getElementById('solo-controls');
    const waitingMsg = document.getElementById('waiting-msg');

    function renderPage(num) {
      if (!pdfDoc) return;
      pageRendering = true;
      pdfDoc.getPage(num).then((page) => {
        const viewport = page.getViewport({ scale: 1.4 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;

        const renderContext = { canvasContext: ctx, viewport: viewport };
        const renderTask = page.render(renderContext);

        renderTask.promise.then(() => {
          pageRendering = false;
          if (pageNumPending !== null) {
            renderPage(pageNumPending);
            pageNumPending = null;
          }
        });
      });
      pageInfo.textContent = `Page ${num} / ${pdfDoc.numPages}`;
    }

    function queueRender(num) {
      if (pageRendering) {
        pageNumPending = num;
      } else {
        renderPage(num);
      }
    }

    window.studentChangePage = function(delta) {
      if (!isSoloWork || !pdfDoc) return;
      if (currentPage + delta >= 1 && currentPage + delta <= pdfDoc.numPages) {
        currentPage += delta;
        queueRender(currentPage);
      }
    };

    function loadBase64PDF(base64Data) {
      const raw = atob(base64Data);
      const rawLength = raw.length;
      const array = new Uint8Array(new ArrayBuffer(rawLength));
      for (let i = 0; i < rawLength; i++) {
        array[i] = raw.charCodeAt(i);
      }

      pdfjsLib.getDocument({ data: array }).promise.then((doc) => {
        pdfDoc = doc;
        waitingMsg.style.display = 'none';
        canvas.style.display = 'block';
        renderPage(currentPage);
      }).catch(err => {
        waitingMsg.textContent = "Error loading document: " + err.message;
      });
    }

    window.joinClass = async function() {
      const studentName = document.getElementById('name').value.trim();
      if (!studentName) return alert('Please enter your name');

      const safeId = studentName.toLowerCase().replace(/[^a-z0-9]/g, '_');
      const studentRef = ref(db, `students/${safeId}`);

      await set(studentRef, {
        name: studentName,
        status: 'active',
        awayCount: 0,
        stars: 0
      });

      document.getElementById('join').style.display = 'none';
      document.getElementById('viewer-container').style.display = 'flex';

      onDisconnect(studentRef).update({ status: 'offline' });

      // Focus Monitoring
      const updateStatus = (status) => update(studentRef, { status });
      document.addEventListener('visibilitychange', () => updateStatus(document.hidden ? 'away' : 'active'));
      window.addEventListener('blur', () => updateStatus('away'));
      window.addEventListener('focus', () => updateStatus('active'));

      // Listen for Streamed PDF from Teacher
      onValue(ref(db, 'session/activePdfData'), (snap) => {
        const base64Data = snap.val();
        if (base64Data) {
          loadBase64PDF(base64Data);
        }
      });

      // Solo Mode Listener
      onValue(ref(db, 'session/soloWork'), (snap) => {
        isSoloWork = !!snap.val();
        if (isSoloWork) {
          modePill.className = 'status-pill pill-solo';
          modePill.textContent = '📖 Solo Work Enabled';
          soloControls.style.display = 'flex';
        } else {
          modePill.className = 'status-pill pill-locked';
          modePill.textContent = '🔒 Teacher Leading';
          soloControls.style.display = 'none';
        }
      });

      // Synchronized Page Turns
      onValue(ref(db, 'session/currentPage'), (snap) => {
        const targetPage = snap.val();
        if (!isSoloWork && targetPage && targetPage !== currentPage) {
          currentPage = targetPage;
          queueRender(currentPage);
        }
      });

      // Confetti & Star Rewards
      let currentStars = 0;
      onValue(studentRef, (snap) => {
        const val = snap.val();
        if (val && val.stars > currentStars) {
          currentStars = val.stars;
          triggerCelebration();
        }
      });
    };

    function triggerCelebration() {
      confetti({ particleCount: 110, spread: 75, origin: { y: 0.6 } });
      const banner = document.getElementById('reward-banner');
      banner.style.top = '20px';
      setTimeout(() => { banner.style.top = '-100px'; }, 3500);
    }
  </script>
</body>
</html>
