<script>/* Lessonlab theme: apply before first paint */

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
 background:radial-gradient(900px 500px at 15% 0%,#e6dcff 0,transparent 60%),radial-gradient(800px 500px at 100% 100%,#d9ecff 0,transparent 55%),#f4f1fb;
 font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:#2a2347}
.card{background:#fff;border:1px solid #e4def5;border-radius:24px;padding:40px 34px 34px;box-shadow:0 18px 50px rgba(95,70,180,.14);text-align:center;width:min(400px,100%)}
.logo{width:72px;height:72px;margin:0 auto 14px;display:block}
h1{margin:0;font-size:2.3rem;font-weight:700;letter-spacing:-.02em}
h1 .a{color:#7d68d0}h1 .b{color:#a68ce6}
.sub{margin:6px 0 28px;color:#7a7396;font-size:1rem}
.opt{display:flex;align-items:center;gap:16px;text-align:left;padding:16px 18px;margin:12px 0;border-radius:16px;text-decoration:none;border:1.5px solid transparent;transition:transform .15s,box-shadow .15s}
.opt:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(95,70,180,.2)}
.opt:focus-visible{outline:3px solid #b9a6f0;outline-offset:2px}
.ico{flex:none;width:48px;height:48px;border-radius:13px;display:grid;place-items:center}
.ico svg{width:28px;height:28px}
.t strong{display:block;font-size:1.15rem;font-weight:600}
.t span{font-size:.88rem;opacity:.85}
.stu{background:#7d68d0;color:#fff}.stu .ico{background:rgba(255,255,255,.2)}
.tea{background:#f1ecfd;color:#3f3182;border-color:#dcd2f7}.tea .ico{background:#fff}
.lab{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;padding:13px 16px;border-radius:14px;border:1.5px dashed #b9a6f0;background:#fff;color:#6d58c2;font-weight:700;font-size:1.02rem;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s}.lab:hover{background:#f7f3ff;transform:translateY(-2px);box-shadow:0 10px 24px rgba(95,70,180,.16)}.lab:focus-visible{outline:3px solid #b9a6f0;outline-offset:2px}

.xp-switch{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;padding:12px 16px;border-radius:16px;border:1.5px dashed #b9a6f0;background:#fff;color:#4a3d8f;cursor:pointer;text-align:left;user-select:none;transition:background .2s,border-color .2s}.xp-text{font-size:1.02rem;font-weight:700}
.xp-switch input{position:absolute;opacity:0;width:0;height:0}
.xp-switch .track{flex:none;width:46px;height:26px;border-radius:99px;background:#d9d2ee;position:relative;transition:background .25s}
.xp-switch .knob{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(40,30,90,.3);transition:transform .25s}
.xp-switch input:checked+.track{background:linear-gradient(90deg,#ff5d8f,#ffb23f,#4cd98a,#3fb6ff,#8b6cff)}
.xp-switch input:checked+.track .knob{transform:translateX(20px)}
.xp-switch input:focus-visible+.track{outline:3px solid #b9a6f0;outline-offset:2px}

/* experiment mode on: a bit multicoloured */

<script>
(function(){
var cb=document.getElementById('xp'),st=document.getElementById('go-student'),te=document.getElementById('go-teacher');
var ext=location.protocol==='file:'?'.html':'';
function apply(on){
  document.body.classList.toggle('xp-on',on);cb.checked=on;
  st.setAttribute('href',(on?'student-p2p':'student')+ext);
  te.setAttribute('href',(on?'teacher-p2p':'teacher')+ext);
}
var on=false;try{on=localStorage.getItem('ll_experiment')==='1'}catch(e){}
apply(on);
cb.addEventListener('change',function(){apply(cb.checked);try{localStorage.setItem('ll_experiment',cb.checked?'1':'0')}catch(e){}});
window.addEventListener('pageshow',function(){var v=false;try{v=localStorage.getItem('ll_experiment')==='1'}catch(e){}apply(v)});
})();
</script>
<style>
/* Dark mode: the whole page is inverted (hue kept), then pictures, booklet pages, logo, emoji and the marking-engine window are turned back so they look normal */
html[data-ll="dark"] { filter: invert(.92) hue-rotate(180deg); background: #fff; }
html[data-ll="dark"] canvas, html[data-ll="dark"] img, html[data-ll="dark"] video, html[data-ll="dark"] svg.lle, html[data-ll="dark"] .logo, html[data-ll="dark"] .emoji svg, html[data-ll="dark"] .me-card { filter: invert(1) hue-rotate(180deg) contrast(1.19); }
/* pop-outs: a plain dark panel (the blurred-glass backdrop turns silver when the page is inverted) */
html[data-ll="dark"] .rail-pop, html[data-ll="dark"] .s-pop { -webkit-backdrop-filter: none !important; backdrop-filter: none !important; background: rgba(247,245,255,.97) !important; }

html[data-ll="dark"] .rail-pop.pgpop #page-num-display, html[data-ll="dark"] .rail-pop.pgpop #page-label, html[data-ll="dark"] .rail-pop.pgpop #page-controls, html[data-ll="dark"] .rail-pop.pgpop #page-input, html[data-ll="dark"] .rail-pop.pgpop #page-total, html[data-ll="dark"] .s-pop.pgpop #page-input, html[data-ll="dark"] .s-pop.pgpop #page-label, html[data-ll="dark"] .s-pop.pgpop #page-total { color: #000 !important; }

#ll-theme-fab svg, #ll-theme svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#ll-theme-pop .rp-opt:active { transform: scale(1.02); }

<script>
/* Lessonlab theme switch: Light / Dark / Auto (follows the device) */
(function () {
  const root = document.documentElement, mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  const ICON = {
    auto: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" style="fill:currentColor"/></svg>',
    light: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
    dark: '<svg class="ic" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>'
  };
  const NAME = { auto: 'Auto', light: 'Light', dark: 'Dark' };
  const get = () => { try { return localStorage.getItem('ll-theme') || 'auto'; } catch (_) { return 'auto'; } };
  function apply(p) {
    const d = p === 'dark' || (p === 'auto' && mq && mq.matches);
    root.setAttribute('data-ll', d ? 'dark' : 'light'); root.setAttribute('data-ll-pref', p);
    const b = document.getElementById('ll-theme'); if (b) { b.innerHTML = ICON[p]; b.title = 'Appearance: ' + NAME[p]; b.setAttribute('aria-label', b.title); }
    const f = document.getElementById('ll-theme-fab'); if (f) { f.innerHTML = ICON[p]; f.title = 'Appearance: ' + NAME[p]; f.setAttribute('aria-label', f.title); }
  }
  function set(p) { try { localStorage.setItem('ll-theme', p); } catch (_) {} apply(p); }
  if (mq) (mq.addEventListener ? mq.addEventListener('change', () => apply(get())) : mq.addListener && mq.addListener(() => apply(get())));
  window.llSetTheme = set;

  /* one click changes the mode: Auto, then Light, then Dark */
  const cycle = () => set({ auto: 'light', light: 'dark', dark: 'auto' }[get()] || 'auto');
  let tries = 0;
  (function place() {
    const so = document.getElementById('signout');
    if (!so || !so.parentNode) { if (tries++ < 60) setTimeout(place, 100); return; }
    if (document.getElementById('ll-theme')) return;
    const b = document.createElement('button'); b.type = 'button'; b.id = 'll-theme';
    b.className = so.className.replace(/\bs-signout\b/, 'll-theme');
    so.parentNode.insertBefore(b, so); b.addEventListener('click', (e) => { e.stopPropagation(); cycle(); });
    apply(get());
  })();
  /* on sign-in / welcome screens the side rail is hidden, so a small corner button stands in for it */
  const fab = document.createElement('button'); fab.type = 'button'; fab.id = 'll-theme-fab'; fab.style.display = 'none'; document.body.appendChild(fab);
  fab.addEventListener('click', (e) => { e.stopPropagation(); cycle(); });
  const syncFab = () => { const b = document.getElementById('ll-theme'); fab.style.display = (b && b.offsetWidth > 0) ? 'none' : 'flex'; };
  setInterval(syncFab, 700); syncFab();
  apply(get());
})();
</script>
<style>
/* one fixed screen: no scrolling, no swipe-back; a more glass-like pane */
html, body { height: 100%; height: 100dvh; overflow: hidden; overscroll-behavior: none; touch-action: none; }
body { position: fixed; inset: 0; width: 100%; }
.card { background: linear-gradient(135deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,.14) 36%, rgba(255,255,255,.06) 62%, rgba(255,255,255,.34) 100%) !important; border: 1px solid rgba(255,255,255,.75) !important; box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 -1px 0 rgba(255,255,255,.35) inset, 0 24px 60px rgba(70,50,150,.18), 0 0 0 .5px rgba(60,50,100,.08) !important; -webkit-backdrop-filter: blur(30px) saturate(1.9) !important; backdrop-filter: blur(30px) saturate(1.9) !important; }
</style>
<script>
/* home screen: no page scroll and no swipe-back */
(function () {
  const opt = { passive: false }, typing = (t) => t && t.closest && t.closest('input,textarea,select');
  document.addEventListener('touchmove', (e) => { if (!typing(e.target)) e.preventDefault(); }, opt);
  document.addEventListener('touchstart', (e) => { if (!e.touches[0]) return; const x = e.touches[0].clientX; if (x < 24 || x > innerWidth - 24) e.preventDefault(); }, opt);
  document.addEventListener('wheel', (e) => e.preventDefault(), opt);
})();
</script>
