<!doctype html>
<html lang="en"><head>
<script>/* Returning student: skip this picker entirely and go straight back into their class (normal mode only — experiment mode keeps its own picker) */
(function(){
  try{
    if (localStorage.getItem('ll_experiment') === '1') return;
    if (localStorage.getItem('cf_student_auto') !== '1') return;
    var ext = location.protocol === 'file:' ? '.html' : '';
    location.replace('student' + ext + location.search + location.hash);   // keeps any ?code=... the link carried, so student.html can still tell a mismatched class apart
  } catch (e) {}
})();
</script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#17171a">
<title>Lessonlab</title>
<link rel="icon" href="lessonlab.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Lessonlab has one look, the same as the Swift app: flat near-black, a solid dark card, pink accents */
*{box-sizing:border-box}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{margin:0;position:fixed;inset:0;width:100%;display:grid;place-items:center;padding:20px;
 background:#17171a;color:#fff;
 font-family:ui-rounded,"SF Pro Rounded","SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"Helvetica Neue",Helvetica,sans-serif;
 -webkit-font-smoothing:antialiased}
.card{position:relative;width:min(362px,100%);padding:34px 30px 32px;border-radius:34px;background:#272729;text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:11px;margin:0 0 26px}
.logo{display:block;width:44px;height:44px;flex:none}
h1{margin:0;font-size:2.25rem;line-height:1;font-weight:700;letter-spacing:-.01em}
h1 .a{color:#ff7fc0}h1 .b{color:#ffc4e3}
.sub{margin:0 0 24px;color:#b4b4b9;font-size:1.02rem;font-weight:600}
.opt{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;margin:0 0 12px;border-radius:999px;border:0;text-decoration:none;font-size:1.12rem;font-weight:700;color:#fff;transition:transform .15s cubic-bezier(.3,1.5,.5,1),filter .15s}
.opt:hover{transform:scale(1.03);filter:brightness(1.06)}
.opt:active{transform:scale(.97)}
.opt:focus-visible{outline:3px solid rgba(255,127,192,.6);outline-offset:2px}
.opt svg{width:22px;height:22px;fill:currentColor;flex:none}
.tea{background:#df78b2}
.stu{background:#48484b;margin-bottom:0}
.xp-switch{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:20px;padding:6px;color:#8e8e94;font-size:.9rem;font-weight:600;cursor:pointer;user-select:none;position:relative}
.xp-switch:hover{color:#b4b4b9}
.xp-switch input{position:absolute;opacity:0;width:0;height:0}
.xp-switch .track{flex:none;width:40px;height:23px;border-radius:99px;background:#3c3c40;position:relative;transition:background .25s}
.xp-switch .knob{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .25s}
.xp-switch input:checked+.track{background:linear-gradient(90deg,#ff5d8f,#ffb23f,#4cd98a,#3fb6ff,#8b6cff)}
.xp-switch input:checked+.track .knob{transform:translateX(17px)}
.xp-switch input:focus-visible+.track{outline:3px solid rgba(255,127,192,.6);outline-offset:2px}
/* experiment mode on: a thin rainbow edge round the card */
body.xp-on .card::before{content:'';position:absolute;inset:-2px;border-radius:inherit;padding:2px;background:linear-gradient(120deg,#ff5d8f,#ffb23f,#4cd98a,#3fb6ff,#8b6cff);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);pointer-events:none}
body.xp-on .xp-switch{color:#d8d8dc}
</style></head><body>
<main class="card">
  <div class="brand">
    <svg class="logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lessonlab logo">
      <g transform="scale(.6667)"><rect x="4" y="4" width="88" height="88" rx="22" fill="#e85fa6"/><path d="M34 26 V68 H66" fill="none" stroke="#ffe9f4" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" transform="translate(-6 8)"/><circle cx="70" cy="24" r="6" fill="#ffe9f4"/><circle cx="79" cy="38" r="4" fill="#ffe9f4"/><circle cx="76" cy="14" r="3" fill="#ffe9f4"/></g>
    </svg>
    <h1><span class="a">Lesson</span><span class="b">lab</span></h1>
  </div>
  <p class="sub">Choose how this device is being used</p>

  <a class="opt tea" id="go-teacher" href="teacher">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2 1.6 8.6a.6.6 0 0 0 0 1.1L12 15.1l8.1-4.2v5.3a1 1 0 0 0 2 0V9.5a.6.6 0 0 0 0-.9z"/><path d="M5.4 13.3v3.5c0 1.7 3 3.4 6.6 3.4s6.6-1.7 6.6-3.4v-3.5L12 16.7z"/></svg>
    I'm the Teacher
  </a>
  <a class="opt stu" id="go-student" href="student">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11.1 5.6C9.6 4.5 7.4 4 4.2 4.1a1 1 0 0 0-1 1v11.6a1 1 0 0 0 1.1 1c2.7-.1 4.7.3 6.2 1.3.4.3.6-.1.6-.4V6.4c0-.3-.1-.6-.0-.8zM12.9 5.6c1.5-1.1 3.7-1.6 6.9-1.5a1 1 0 0 1 1 1v11.6a1 1 0 0 1-1.1 1c-2.7-.1-4.7.3-6.2 1.3-.4.3-.6-.1-.6-.4V6.4c0-.3.1-.6 0-.8z"/></svg>
    I'm a Student
  </a>
  <label class="xp-switch" for="xp"><input type="checkbox" id="xp" role="switch"><span class="track"><span class="knob"></span></span><span class="xp-text">🧪 Experiment mode</span></label>
</main>
<script>
(function(){
var cb=document.getElementById('xp'),st=document.getElementById('go-student'),te=document.getElementById('go-teacher');
var ext=location.protocol==='file:'?'.html':'';
function apply(on){
  document.body.classList.toggle('xp-on',on);cb.checked=on;
  st.setAttribute('href',(on?'student-ws':'student')+ext);
  te.setAttribute('href',(on?'teacher-ws':'teacher')+ext);
}
var on=false;try{on=localStorage.getItem('ll_experiment')==='1'}catch(e){}
apply(on);
cb.addEventListener('change',function(){apply(cb.checked);try{localStorage.setItem('ll_experiment',cb.checked?'1':'0')}catch(e){}});
window.addEventListener('pageshow',function(){var v=false;try{v=localStorage.getItem('ll_experiment')==='1'}catch(e){}apply(v)});
})();
</script>
<script>
/* home screen: no page scroll and no swipe-back */
(function () {
  const opt = { passive: false }, typing = (t) => t && t.closest && t.closest('input,textarea,select');
  document.addEventListener('touchmove', (e) => { if (!typing(e.target)) e.preventDefault(); }, opt);
  document.addEventListener('touchstart', (e) => { if (!e.touches[0]) return; const x = e.touches[0].clientX; if (x < 24 || x > innerWidth - 24) e.preventDefault(); }, opt);
  document.addEventListener('wheel', (e) => e.preventDefault(), opt);
})();
</script>
</body></html>
