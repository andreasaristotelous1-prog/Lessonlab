  <style>
    :root {
      --bg: #f5f3fb; --text: #2f3552; --muted: #7b82a0; --line: #e4e1f1;
      --lav: #e7e1f5; --lav-2: #ece9f6;
    }
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100%; overflow: hidden; color: var(--text);
      font-family: var(--font);
      background: linear-gradient(135deg, #f6f1fb 0%, #eef5fb 50%, #effaf5 100%) fixed;
    }
    button, input { font-family: inherit; }

    /* ---------- brand ---------- */
    .brand-wrap { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .logo { width: 28px; height: 28px; flex-shrink: 0; }
    .logo svg { width: 100%; height: 100%; display: block; overflow: visible; }
    .brand { font-weight: 700; font-size: 1.3rem; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
    .brand .w-c { color: #e0719e; }
    .brand .w-f { color: #5b9bd5; }

    /* ---------- join screen ---------- */
    #join { display: flex; align-items: center; justify-content: center; height: 100%; height: 100dvh; padding: 1rem; }
    .back-link { align-self: flex-start; width: max-content; margin: 0 0 12px; display: flex; align-items: center; gap: 4px; padding: 5px 10px 5px 8px; border-radius: 999px; font-size: .86rem; font-weight: 600; text-decoration: none; color: #7d68d0; background: #f1ecfd; }
    .back-link:hover { background: #e6dcfb; }
    .back-link:focus-visible { outline: 3px solid #b9a6f0; outline-offset: 2px; }
    .join-card {
      position: relative;
      width: min(380px, 100%); background: #fff; border: 1px solid var(--line); border-radius: 18px;
      padding: 26px 24px 22px; text-align: center; display: flex; flex-direction: column; align-items: stretch;
      box-shadow: 0 10px 40px rgba(70,55,120,.10);
    }
    .join-card .brand-wrap { justify-content: center; margin-bottom: 4px; }
    .join-card .logo { width: 44px; height: 44px; }
    .join-card .brand { font-size: 2rem; }
    .join-card h2 { margin: 10px 0 2px; font-size: 1.15rem; font-weight: 700; }
    .hint { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
    .join-card input {
      width: 100%; padding: 12px 14px; margin: 5px 0; font-size: 1.05rem; font-weight: 600; color: var(--text);
      background: #faf9fe; border: 1.5px solid var(--line); border-radius: 12px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .join-card input:focus { border-color: #b9a6f0; box-shadow: 0 0 0 3px rgba(185,166,240,.25); background: #fff; }
    #code { text-transform: uppercase; }
    #code::placeholder { text-transform: none; }
    #class-name { min-height: 1.4em; color: #2c7a5a; font-weight: 700; text-align: center; margin-top: 2px; }
    #join-error { min-height: 1.4em; margin: 2px 0 4px; color: #b3414f; font-size: .92rem; font-weight: 600; text-align: center; }
    #start-btn {
      width: 100%; padding: 12px 16px; font-size: 1.05rem; font-weight: 700; border: 1px solid #a9dcc0; border-radius: 12px;
      background: #d5f2e3; color: #276a4b; cursor: pointer; transition: background .15s;
    }
    #start-btn:hover { background: #c6ebd8; }
    #start-btn:disabled { opacity: .6; cursor: default; }

    /* ---------- lesson screen ---------- */
    #viewer-container { display: none; flex-direction: column; height: 100%; height: 100dvh; padding: 6px 8px; gap: 6px; }

    .top-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3px 10px; min-height: 36px;
    }
    .top-left, .top-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .top-right { justify-content: flex-end; }

    .me-pill {
      display: inline-flex; align-items: center; gap: 8px; padding: 2px 6px 2px 3px; border-radius: 999px;
      background: #eef3fb; border: 1.5px solid #cfdcf0; min-width: 0;
    }
    #my-emoji {
      font-size: 1.35rem; line-height: 1; width: 1.7rem; height: 1.7rem; display: grid; place-items: center;
      background: rgba(255,255,255,.75); border-radius: 50%; flex-shrink: 0;
      font-family: 'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;
    }
    #my-name { font-weight: 700; font-size: .98rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34vw; }
    .me-score { display: inline-flex; align-items: baseline; gap: 3px; background: rgba(255,255,255,.78); border-radius: 999px; padding: 0 10px; flex-shrink: 0; }
    #my-stars { font-weight: 800; font-size: 1.05rem; color: #6a5418; }
    .me-score small { font-size: .7rem; font-weight: 700; color: #85703a; }
    .me-score.pop { animation: pop .5s cubic-bezier(.3,1.8,.5,1); }
    @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.3); } 100% { transform: scale(1); } }

    #class-title { font-weight: 700; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 28vw; }
    .code-chip {
      font-weight: 800; font-size: .9rem; letter-spacing: .16em; padding: 1px 10px; border-radius: 9px;
      border: 1.5px dashed #f0bf9c; background: #ffe9d9; color: #86492a;
    }
    .timer-pill {
      font-size: 1.05rem; font-weight: 700; padding: 1px 12px; border-radius: 9px; background: #e9f1fb; color: #2f5a86;
      font-variant-numeric: tabular-nums; letter-spacing: .03em; white-space: nowrap;
    }
    .timer-pill[hidden] { display: none; }
    .timer-pill.paused { background: #f1eef9; color: #7b82a0; }
    .timer-pill.low { background: #ffe9d9; color: #a4531f; }
    .timer-pill.done { background: #fde1ea; color: #a13a5d; animation: tpulse 1s ease-in-out infinite; }
    @keyframes tpulse { 50% { opacity: .55; } }

    .sub-bar {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
      background: var(--lav); border-radius: 10px; padding: 3px 10px; min-height: 32px;
    }
    .sub-bar > .zoom-controls { justify-self: start; }
    .sub-bar > #mode-pill { justify-self: center; }
    #page-info { white-space: nowrap; }
    .right-tools { justify-self: end; display: flex; align-items: center; gap: 8px; }
    .zoom-controls { display: flex; align-items: center; gap: 4px; }
    .zoom-controls button {
      min-width: 26px; padding: 2px 8px; font-size: .85rem; font-weight: 700; color: var(--text); background: #fff;
      border: 1px solid #ddd8ee; border-radius: 8px; cursor: pointer;
    }
    .zoom-controls button:hover { background: #f4f1fb; }
    #zoom-display { min-width: 3.2em; text-align: center; font-size: .8rem; font-weight: 700; color: #6b6392; }
    .status-pill { font-size: .8rem; padding: 2px 11px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
    .pill-locked { background: rgba(255,255,255,.65); color: #6b6392; }
    .pill-solo { background: #a9e1d2; color: #1d5a4a; }
    #page-info { font-weight: 700; font-size: .88rem; color: #4a4f6e; }
    #page-controls[hidden] { display: none; }
    #page-input {
      width: 3.4em; padding: 1px 4px; margin: 0 2px; text-align: center; font: inherit; font-weight: 700; color: var(--text);
      background: #fff; border: 1px solid #ddd8ee; border-radius: 8px; outline: none; -moz-appearance: textfield; appearance: textfield;
    }
    #page-input::-webkit-outer-spin-button, #page-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    #page-input:focus { border-color: #b9a6f0; box-shadow: 0 0 0 3px rgba(185,166,240,.25); }
    /* when the teacher is leading, the number is just shown, not editable */
    #page-input:disabled { background: transparent; border-color: transparent; color: #4a4f6e; opacity: 1; -webkit-text-fill-color: #4a4f6e; }
    .nav-btns { display: none; gap: 6px; }
    .nav-btns button {
      white-space: nowrap;
      padding: 3px 12px; font-size: .8rem; font-weight: 700; color: var(--text); background: #fff;
      border: 1px solid #ddd8ee; border-radius: 8px; cursor: pointer;
    }
    .nav-btns button:hover { background: #f4f1fb; }

    .canvas-scroll-area {
      flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; align-items: flex-start;
      padding: 10px; background: var(--lav-2); border-radius: 10px; touch-action: pan-x pan-y; overscroll-behavior: contain;
    }
    canvas { display: block; margin: 0 auto; flex-shrink: 0; box-shadow: 0 2px 14px rgba(46,58,78,.2); border-radius: 4px; }
    .canvas-scroll-area.zoomed { cursor: grab; }
    .canvas-scroll-area.zoomed.panning { cursor: grabbing; }
    #waiting-msg { align-self: center; margin-top: 40px; color: var(--muted); font-size: 1.1rem; text-align: center; }

    #reward-banner {
      position: fixed; top: -100px; left: 50%; transform: translateX(-50%);
      background: #fff2c4; color: #6a5418; border: 1.5px solid #ecd783; padding: 12px 24px; border-radius: 30px;
      font-size: 1.15rem; font-weight: 700; box-shadow: 0 10px 25px rgba(70,55,120,.2);
      transition: top 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 9999;
    }

    #ended {
      display: none; position: fixed; inset: 0; z-index: 10000; background: rgba(245,243,251,.97);
      flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1.5rem;
    }
    #ended h2 { margin: 0 0 6px; }
    #ended p { color: var(--muted); margin: 0 0 14px; max-width: 320px; }
    #ended button {
      padding: 10px 20px; font-size: 1rem; font-weight: 700; border: 1px solid #a9dcc0; border-radius: 12px;
      background: #d5f2e3; color: #276a4b; cursor: pointer;
    }

    @media (max-width: 640px) {
      .brand { display: none; }
      .top-left { width: 100%; }
      .me-pill { flex: 1; }
      #my-name { max-width: none; flex: 1; }
      .top-right { width: 100%; justify-content: space-between; }
      #class-title { max-width: 45vw; }
      .sub-bar { grid-template-columns: auto auto; row-gap: 4px; }
      .sub-bar > #mode-pill { grid-column: 1 / -1; grid-row: 2; }
      #page-info { white-space: nowrap; }
    }

    /* purple wordmark to match the logo */
    .brand .w-c { color: #7d68d0; }
    .brand .w-f { color: #a68ce6; }

    .brand .w-role { color: #8d86ad; font-weight: 600; letter-spacing: 0; }
    .top-bar .brand .w-role { font-size: .85em; }
  
    /* ===== full-screen class code ===== */
    #code-screen { position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
      background: radial-gradient(900px 600px at 15% 0%, #5a46b0 0, transparent 60%), radial-gradient(800px 600px at 100% 100%, #2f5f9c 0, transparent 55%), #2a2347;
      color: #fff; font-family: var(--font); cursor: pointer; }
    #code-screen[hidden] { display: none; }
    #code-screen .cs-inner { display: flex; flex-direction: column; align-items: center; gap: min(2.2vh, 18px); max-width: 100%; }
    #code-screen .cs-step { font-size: clamp(1.1rem, 3.4vw, 2.2rem); font-weight: 600; opacity: .85; }
    #code-screen .cs-addr { font-size: clamp(1.5rem, 6.4vw, 4.4rem); font-weight: 800; letter-spacing: .01em; background: rgba(255,255,255,.14); border: 2px dashed rgba(255,255,255,.55);
      border-radius: 20px; padding: .18em .6em; max-width: 100%; overflow-wrap: anywhere; }
    #code-screen .cs-code { font-size: min(15vw, 34vh); line-height: 1; font-weight: 800; letter-spacing: .06em; padding-left: .06em; max-width: 100%; }
    #code-screen .cs-xp { font-size: clamp(.85rem, 2.2vw, 1.3rem); font-weight: 800; letter-spacing: .12em; padding: .35em 1em; border-radius: 99px; color: #1f1b3a;
      background: linear-gradient(90deg,#ff7aa5,#ffc46b,#ffe980,#7ae5a7,#6cc8ff,#a590ff); }
    #code-screen .cs-hint { font-size: clamp(.8rem, 1.8vw, 1.1rem); opacity: .6; margin-top: 1vh; }
    #code-screen #cs-close { position: absolute; top: 14px; right: 18px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.16); color: #fff; font-size: 1.4rem; cursor: pointer; }
    #code-screen #cs-close:hover { background: rgba(255,255,255,.28); }
    /* ---------- DIAGNOSTICS ---------- */
    #dg-fab { position: fixed; right: 16px; top: 100px; z-index: 8000; display: none; padding: 10px 16px; border: none; border-radius: 999px; background: #7d68d0; color: #fff; font-weight: 700; font-size: .95rem; box-shadow: 0 8px 22px rgba(125,104,208,.4); cursor: pointer; }
    #dg-fab.on { display: block; }
    .dg-pop { position: fixed; z-index: 9100; display: flex; flex-direction: column; gap: 4px; padding: 6px; border-radius: 18px; background: rgba(255,255,255,.82); backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); box-shadow: 0 14px 40px rgba(40,30,100,.22); animation: dgpopin .16s ease-out; }
    @keyframes dgpopin { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .dg-pop button { display: flex; align-items: center; gap: 10px; padding: 10px 16px 10px 12px; border: 0; border-radius: 13px; background: transparent; color: #25233a; font: inherit; font-weight: 700; cursor: pointer; text-align: left; }
    .dg-pop button:hover:not(:disabled) { background: #efeafc; }
    .dg-pop button:disabled { opacity: .38; cursor: default; }
    .dg-pop .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .dg-pop em { margin-left: auto; font-style: normal; font-size: .72rem; background: #7d68d0; color: #fff; border-radius: 999px; padding: 1px 7px; }
    .dg-list { display: grid; gap: 8px; margin-top: 8px; }
    .dg-li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: #fff; font: inherit; color: var(--text); cursor: pointer; text-align: left; }
    .dg-li:hover { background: #f6f3fd; }
    .dg-li span { color: var(--muted); font-weight: 600; white-space: nowrap; }
    #dg-fab.pulse { animation: dgpulse 1.6s ease-in-out infinite; }
    @keyframes dgpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.07); } }
    #dg-ov { position: fixed; inset: 0; z-index: 9000; display: none; overflow: auto; background: #f5f3fb; padding: 20px 14px 40px; }
    #dg-ov.on { display: block; }
    .dg-card { max-width: 720px; margin: 0 auto; background: #fff; border: 1px solid var(--line); border-radius: 22px; padding: 22px 20px; box-shadow: 0 14px 40px rgba(110,100,170,.15); }
    .dg-card h2 { margin: 0 0 2px; font-size: 1.45rem; letter-spacing: -.01em; color: #4a3a99; }
    .dg-card .dg-hint { margin: 0 0 16px; color: var(--muted); font-size: .92rem; }
    .dg-qs { display: grid; gap: 16px; }
    .dg-qn { font-weight: 600; line-height: 1.35; }
    .dg-qn .dg-m { color: var(--muted); font-weight: 500; font-size: .85rem; margin-left: 6px; white-space: nowrap; }
    .dg-ta { width: 100%; margin-top: 7px; padding: 11px 13px; font: inherit; font-size: 1.02rem; color: var(--text); background: #fff; border: 1.5px solid #d9d4ee; border-radius: 13px; outline: none; resize: vertical; min-height: 46px; }
    .dg-ta:focus { border-color: #7d68d0; box-shadow: 0 0 0 3px rgba(125,104,208,.2); }

    /* answering: each box starts as tall as the question has mark points (one line per point, at least two) and grows downwards as the student types */
    #dg-ov.ans .dg-ta { resize: none; overflow: hidden; line-height: 1.45; font-size: 1.05rem; min-height: 0; }
    .dg-label { display: block; width: fit-content; margin: 0 auto 8px; padding: 4px 12px; border-radius: 999px; background: #efeafc; color: #4a3a99; font-size: .78rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .dg-go { margin-top: 20px; width: 100%; padding: 14px; border: none; border-radius: 14px; background: #7d68d0; color: #fff; font-weight: 700; font-size: 1.05rem; cursor: pointer; }
    .dg-go:disabled { opacity: .55; cursor: default; }
    .dg-back { background: none; border: none; color: #7d68d0; font-weight: 600; font-size: .9rem; cursor: pointer; padding: 6px 0 14px; }
    .dg-timer { display: block; width: fit-content; margin: 6px auto 12px; padding: 6px 16px; border-radius: 999px; background: #efeafc; color: #4a3a99; font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; text-align: center; }
    .dg-timer.low { background: #ffe9d9; color: #a4531f; }
    .dg-score { text-align: center; margin: 6px 0 18px; }
    .dg-score b { display: block; font-size: 3rem; color: #4a3a99; line-height: 1.1; }
    .dg-score span { color: var(--muted); font-weight: 500; }
    .dg-res { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); margin-top: 10px; }
    .dg-res.ok { background: #edf8f2; border-color: #bfe3cf; } .dg-res.no { background: #fdf0f1; border-color: #f0c5ca; } .dg-res.part { background: #fff7e8; border-color: #f0dcae; }
    .dg-res .a { margin-top: 4px; font-weight: 600; white-space: pre-wrap; word-break: break-word; }
    .dg-res .k { margin-top: 4px; font-size: .85rem; color: #2c6e50; }
    .dg-fb { margin-top: 6px; }
    .dg-ln { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; border-top: 1px dashed rgba(0,0,0,.1); }
    .dg-ln:first-child { border-top: none; }
    .dg-lt { flex: 1; font-weight: 600; line-height: 1.5; word-break: break-word; }
    .dg-lt .g { background: #cdeedb; color: #14683f; border-radius: 4px; padding: 0 2px; }
    .dg-lt .x { background: #fbd9dd; color: #a3263a; border-radius: 4px; padding: 0 2px; text-decoration: line-through; text-decoration-thickness: 2px; }
    .dg-lm { display: flex; flex-direction: column; gap: 4px; align-items: flex-end; min-width: 64px; }
    .dg-pt { background: #2f9e6a; color: #fff; border-radius: 999px; padding: 2px 9px; font-size: .8rem; font-weight: 700; white-space: nowrap; }
    .dg-lt .p1 { background: #cfe3fb; color: #17509a; } .dg-lt .p2 { background: #cdeedb; color: #14683f; } .dg-lt .p3 { background: #fde3b8; color: #8a4b05; } .dg-lt .p4 { background: #e4d6fa; color: #5b2fa3; }
    .dg-lt .p5 { background: #fbd3e8; color: #9c1f63; } .dg-lt .p6 { background: #c9f0f0; color: #0e6b6b; } .dg-lt .p7 { background: #f3f0b5; color: #6b6405; } .dg-lt .p8 { background: #e2e2e2; color: #444; }
    .dg-lt .p9, .dg-lt .p10, .dg-lt .p11, .dg-lt .p12 { background: #e2e2e2; color: #444; }

/* =====================================================
   APPLE-STYLE THEME (Liquid Glass era guidance)
   - Glass only on the functional layer: top bar, tab controls, floating buttons and sheets. Content (booklet, lists,
     tables, cards, answer boxes) is solid, so it stays readable and the glass has something to float over.
   - One accent (Lessonlab lilac) for selection and primary actions. Colour elsewhere only carries meaning
     (green = marked / open, orange = live or needs checking, red = delete). No decorative colour.
   - Line icons that match the text weight instead of emoji. Capsule buttons. Grey fills, no outlines.
   - Font: Arial Rounded MT Bold for interface text (it only comes in bold), Nunito for long reading text.
   ===================================================== */
:root {
  --font: 'Arial Rounded MT Bold', 'Arial Rounded MT', 'Nunito', ui-rounded, 'SF Pro Rounded', -apple-system, 'Segoe UI', sans-serif;
  --font-read: 'Nunito', 'Arial Rounded MT Bold', ui-rounded, -apple-system, 'Segoe UI', sans-serif;
  --text: #25233a; --muted: #6b6880; --accent: #6f5bc9; --accent-ink: #fff; --accent-soft: rgba(111,91,201,.12);
  --fill: rgba(118,118,128,.12); --fill-hover: rgba(118,118,128,.2); --hair: rgba(60,50,100,.12);
  --glass: rgba(255,255,255,.66); --glass-line: rgba(255,255,255,.85);
  --glass-shadow: 0 1px 0 rgba(255,255,255,.7) inset, 0 8px 28px rgba(35,25,90,.1), 0 0 0 .5px rgba(60,50,100,.08);
  --panel-border: var(--hair); --good: #2f8f63; --warn: #c9701a; --bad: #c0392b;
}
html, body, button, input, select, textarea { font-family: var(--font); }
html { background: #efeef6; }
body {
  color: var(--text);
  background: radial-gradient(900px 500px at 8% -10%, rgba(190,175,240,.38), transparent 70%), radial-gradient(800px 500px at 100% 110%, rgba(190,215,235,.4), transparent 70%), #efeef6;
}
.ic { stroke-width: 1.8; }

/* generic controls: grey capsule fills, accent for the primary action */
.btn, .nc-btn { background: var(--fill); border: 0; color: var(--text); border-radius: 999px; font-weight: 700; box-shadow: none; }
.btn:hover, .nc-btn:hover { background: var(--fill-hover); transform: none; border: 0; }
.btn:active { transform: scale(.97); }
.btn.grey { background: transparent; color: var(--muted); }
.btn.grey:hover { background: var(--fill); }
.btn.green { background: var(--accent); color: var(--accent-ink); }
.btn.green:hover { background: #5f4cb8; }
.btn:disabled { opacity: .4; }
.btn:focus-visible, .tab:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input, select, textarea { font-family: var(--font); }
#t-min, .erow input, #page-input { background: rgba(255,255,255,.9); border: .5px solid var(--hair); }
.code-pill { background: var(--fill); border: 0; color: var(--text); }
.code-pill:hover { background: var(--fill-hover); }
#class-select { background-color: var(--fill); border: 0; color: var(--text); }
#class-select:hover { background-color: var(--fill-hover); }
.timer-clock, .dg-clk { background: var(--fill); color: var(--text); }
.timer-clock.paused, .dg-clk.paused { color: var(--muted); }
.timer-clock.low, .dg-clk.low { background: rgba(201,112,26,.14); color: #a85a0c; }
.tab-count { background: var(--accent-soft); color: var(--accent); }
.chip { background: var(--fill); color: var(--text); }

/* functional layer = glass */
.top-bar { background: var(--glass); backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); border: 1px solid var(--glass-line); border-radius: 22px; box-shadow: var(--glass-shadow); padding: 6px 14px; }
.brand .w-c { color: var(--accent); } .brand .w-f { color: #a994e6; } .brand .w-role { color: #9a90c4; }

/* segmented controls: grey track, white thumb for the selected one */
.tab-group, .dg-tabs { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--fill); width: fit-content; border: 0; }
.tab, .dg-tabs .dg-tab, .dg-tabs .dg-tab[class*="tc-"] { background: transparent; border: 0; border-radius: 999px; box-shadow: none; color: var(--muted); font-weight: 700; padding: 5px 16px; margin: 0; }
.tab:hover, .dg-tabs .dg-tab:hover { background: rgba(255,255,255,.5); color: var(--text); }
.tab.active, .tab[data-tab="students"].active, .dg-tabs .dg-tab.on, .dg-tabs .dg-tab[class*="tc-"].on { background: #fff; color: var(--text); box-shadow: 0 1px 3px rgba(30,20,80,.16), 0 0 0 .5px rgba(60,50,100,.06); }
.mode-toggle, .tabs .mode-toggle { background: var(--fill); border: 0; border-radius: 999px; }

.dg-tabs .tc-done::before { background: var(--good); }

.ic { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.2em; }
.ic.xl { width: 3.4rem; height: 3.4rem; stroke-width: 1.4; color: var(--muted); opacity: .7; display: block; margin: 0 auto 8px; }

/* =====================================================
   ALL-GLASS LAYER: everything translucent over the Lessonlab colour blobs (Statslab look),
   keeping the Apple parts: line icons, capsule buttons, button sizes, rounded type.
   ===================================================== */
:root {
  --gl: rgba(255,255,255,.58); --gl-soft: rgba(255,255,255,.34); --gl-hi: rgba(255,255,255,.82);
  --gl-line: rgba(255,255,255,.92); --sel: rgba(111,91,201,.17); --sel-ink: #3b2f7a;
  --fill: rgba(255,255,255,.55); --fill-hover: rgba(255,255,255,.88);
  --hair: rgba(111,91,201,.14);
}
html { background: #e4def5; }
body {
  background:
    radial-gradient(380px 380px at 3% 38%, rgba(176,156,236,.8), transparent 70%),
    radial-gradient(320px 320px at 78% 0%, rgba(255,200,166,.85), transparent 70%),
    radial-gradient(440px 440px at 100% 95%, rgba(176,218,200,.85), transparent 70%),
    linear-gradient(135deg, #e4def5 0%, #eceaf8 48%, #dfeaf4 100%) fixed;
}
/* controls: translucent white capsules with a bright edge */
.btn, .nc-btn, .zoom-controls button, .nav-btns button { background: var(--gl); border: 1px solid var(--gl-line); box-shadow: 0 1px 0 rgba(255,255,255,.7) inset; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.btn:hover, .nc-btn:hover, .zoom-controls button:hover, .nav-btns button:hover { background: var(--gl-hi); border: 1px solid #fff; }
.btn.grey { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; }
.btn.grey:hover { background: var(--gl-hi); }
.btn.green { background: rgba(111,91,201,.92); border-color: rgba(255,255,255,.35); color: #fff; }
.btn.green:hover { background: #5f4cb8; }
.dg-tctl .btn.icon-btn { background: transparent; border-color: transparent; box-shadow: none; backdrop-filter: none; }
.dg-tctl .btn.icon-btn:hover { background: var(--gl-hi); }
.code-pill, .code-chip { background: rgba(255,214,190,.78); color: #7a3f22; border: 0; }
.code-pill:hover { background: rgba(255,203,170,.92); }
#class-select { background-color: rgba(220,235,250,.7); color: #2e4a66; border: 1px solid var(--gl-line); }
#class-select:hover { background-color: rgba(205,226,247,.88); }
#t-min, .erow input, #page-input { background: rgba(255,255,255,.7); border: 1px solid var(--gl-line); }
.chip, .me-pill, .status-pill, .pill-locked, .dg-pill, .dg-label { background: rgba(255,255,255,.6); }
.me-score { background: rgba(255,255,255,.8); }
/* segmented controls: glass track, lilac thumb */
.tab-group, .dg-tabs, .mode-toggle, .tabs .mode-toggle { background: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.75); }
.tab:hover, .dg-tabs .dg-tab:hover { background: rgba(255,255,255,.55); }
.tab.active, .tab[data-tab="students"].active, .dg-tabs .dg-tab.on, .dg-tabs .dg-tab[class*="tc-"].on { background: var(--sel); color: var(--sel-ink); box-shadow: 0 0 0 1px rgba(255,255,255,.7) inset; }
.mode-thumb { background: var(--sel); box-shadow: none; }
.mode-toggle.solo .mode-thumb { background: rgba(61,154,114,.22); box-shadow: none; }
.mode-opt.active { color: var(--sel-ink); } .mode-toggle.solo .mode-opt.active { color: #1d5a4a; }
.timer-clock, .dg-clk, .timer-pill, .dg-timer { background: var(--sel); color: var(--sel-ink); }
.timer-clock.paused, .dg-clk.paused { background: rgba(120,126,160,.15); color: var(--muted); }
.timer-clock.low, .dg-clk.low, .timer-pill.low, .dg-timer.low { background: rgba(201,112,26,.16); color: #a85a0c; }
/* panels */
.top-bar, .sub-bar { background: var(--gl); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); }
.workspace { background: var(--gl-soft); backdrop-filter: blur(16px) saturate(1.5); -webkit-backdrop-filter: blur(16px) saturate(1.5); border: 1px solid var(--gl-line); box-shadow: 0 6px 22px rgba(70,50,140,.1); }
.tabs { background: rgba(255,255,255,.3); border-bottom: 1px solid var(--hair); backdrop-filter: none; -webkit-backdrop-filter: none; }
.pdf-toolbar, .roster-header { background: transparent; border-bottom: 1px solid var(--hair); }
.pdf-panel, .pdf-canvas-container { background: transparent; }
.canvas-scroll-area { background: var(--gl-soft); border: 1px solid var(--gl-line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.card { background: color-mix(in srgb, var(--pb, #fff) 70%, transparent); border: 1px solid rgba(255,255,255,.95); box-shadow: 0 2px 8px rgba(70,50,140,.06); }
.card:hover, .card:active { background: color-mix(in srgb, var(--pb, #fff) 86%, transparent); filter: none; }
/* sheets */
.modal-card, .diag-card, .join-card { background: rgba(255,255,255,.72); backdrop-filter: blur(28px) saturate(1.7); -webkit-backdrop-filter: blur(28px) saturate(1.7); border: 1px solid var(--gl-line); }
.diag-card { transition: background-color .35s ease; }
.diag-card.tint-live { background: rgba(255,244,230,.78); }
.diag-card.tint-done { background: rgba(236,251,242,.78); }
.diag-card.tint-tpl { background: rgba(255,255,255,.72); }
.dg-live, .dg-item, .dg-opts, .dg-tbl, .dg-tw, .dg-g, .dg-res { background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9); }
.dg-item.go:hover, .dg-item.go:focus-visible { background: rgba(255,255,255,.88); border-color: #fff; box-shadow: 0 4px 16px rgba(70,50,140,.12); }
.join-card input, .dg-ta { background: rgba(255,255,255,.75); border: 1px solid var(--gl-line); }
.dg-card { background: rgba(255,255,255,.7); backdrop-filter: blur(28px) saturate(1.7); -webkit-backdrop-filter: blur(28px) saturate(1.7); border: 1px solid var(--gl-line); }
#dg-ov { background: rgba(228,222,245,.55); }

/* ---- uploaded booklet: the page sits in a frosted glass frame ---- */
#student-canvas { border-radius: 12px; box-shadow: 0 0 0 7px rgba(255,255,255,.42), 0 0 0 8px rgba(255,255,255,.95), 0 20px 50px rgba(70,50,140,.22); }
.canvas-scroll-area { background: var(--gl-soft); }

/* =====================================================
   FONT: plain Arial everywhere. BUTTONS: glass with a colour shining through, one size per place, one colour per function.
   Colours: lilac = view / main action, orange = timer, blue = class, green = diagnostics + data, grey = account.
   ===================================================== */
:root { --font: Arial, 'Helvetica Neue', Helvetica, sans-serif; --font-read: Arial, 'Helvetica Neue', Helvetica, sans-serif;
  --c-view: 111,91,201; --c-mode: 111,91,201; --c-time: 242,140,40; --c-class: 70,140,215; --c-data: 47,150,105; --c-acct: 110,106,140; }
html, body, button, input, select, textarea, .dg-lbl { font-family: var(--font); }
.modal-sub, .dg-sub, .dg-empty, .modal-label, .dg-ta, .dg-lt, .dg-kp, .dg-qn, .dg-wait, .dg-ms, .dg-leg, .hint { font-weight: 400; }
.brand, .brand * { font-family: var(--font); }

/* glass button recipe: bright top edge, tint rising from below, soft coloured glow */
.gb, .rail-grp .btn, .rail-grp .tab, .rail-grp .mode-opt {
  background: linear-gradient(160deg, rgba(255,255,255,.78) 0%, rgba(var(--c),.30) 100%);
  border: 1px solid rgba(255,255,255,.9); color: rgb(var(--ci, 60,50,110));
  box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 -8px 14px rgba(var(--c),.16) inset, 0 4px 12px rgba(var(--c),.22);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.rail-grp .btn:hover, .rail-grp .tab:hover, .rail-grp .mode-opt:hover { background: linear-gradient(160deg, rgba(255,255,255,.92) 0%, rgba(var(--c),.42) 100%); transform: translateY(-1px); }
.rail-grp .btn:active, .rail-grp .tab:active { transform: scale(.96); }

/* groups on the rail: each is a tinted glass capsule */
.tabs > .rail-grp, .rail-actions > .rail-grp { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; padding: 6px 0; box-sizing: border-box; border-radius: 20px;
  background: linear-gradient(180deg, rgba(var(--c),.10), rgba(var(--c),.04)); border: 1px solid rgba(255,255,255,.75); }
.rail-actions { border-top: 0; padding-top: 0; gap: 10px; }
.rail-grp.g-view { --c: var(--c-view); } .rail-grp.g-mode { --c: var(--c-mode); } .rail-grp.g-time { --c: var(--c-time); --ci: 120,60,10; }
.rail-grp.g-class { --c: var(--c-class); --ci: 25,70,120; } .rail-grp.g-data { --c: var(--c-data); --ci: 20,90,60; } .rail-grp.g-acct { --c: var(--c-acct); }

/* one size for every rail button */
.rail-grp .btn, .rail-grp .tab, .rail-grp .mode-opt, .tabs .timer-wrap .btn.icon-btn, .tabs .timer-wrap .btn.green, .tabs #t-reset { width: 44px; height: 40px; min-width: 0; padding: 0; margin: 0; border-radius: 14px; justify-content: center; }
.rail-grp .tab.active, .rail-grp .tab[data-tab="students"].active { background: linear-gradient(160deg, rgba(255,255,255,.55) 0%, rgba(var(--c),.62) 100%); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 4px 14px rgba(var(--c),.4); }
.rail-grp .tab.active .ic { color: #fff; }
.rail-grp .tab .tab-count { background: rgba(255,255,255,.9); color: rgb(var(--c)); }
.tabs .mode-opt.active, .tabs .mode-toggle.solo .mode-opt.active { background: linear-gradient(160deg, rgba(255,255,255,.55) 0%, rgba(var(--c),.62) 100%); color: #fff; }
.tabs .mode-toggle.solo .mode-opt.active { --c: 47,150,105; }
.g-mode .mode-toggle, .g-view .tab-group { background: transparent; border: 0; padding: 0; gap: 6px; }
.g-mode .controls, .g-mode .mode-toggle { width: auto; }
.rail-grp.g-time .btn.green { background: linear-gradient(160deg, rgba(255,255,255,.55) 0%, rgba(var(--c),.7) 100%); color: #fff; }
.rail-grp.g-time .timer-clock { background: rgba(255,255,255,.7); color: rgb(120,60,10); }
.rail-actions .btn { position: relative; }
.rail-actions #signout { backdrop-filter: blur(8px); box-shadow: 0 1px 0 rgba(255,255,255,.95) inset, 0 4px 12px rgba(var(--c),.18); }

/* other buttons, same recipe by function */
.pdf-toolbar .btn, .roster-header .btn, .zoom-controls button, .nav-btns button { background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(70,140,215,.24)); border: 1px solid rgba(255,255,255,.9); color: #19467a; box-shadow: 0 1px 0 #fff inset, 0 3px 10px rgba(70,140,215,.18); }
.pdf-toolbar .btn:hover, .roster-header .btn:hover, .zoom-controls button:hover, .nav-btns button:hover { background: linear-gradient(160deg, rgba(255,255,255,.95), rgba(70,140,215,.36)); }
.pdf-toolbar .btn.grey { background: linear-gradient(160deg, rgba(255,255,255,.78), rgba(111,91,201,.24)); color: #3b2f7a; }
.roster-header .btn.green, .btn.green { background: linear-gradient(160deg, rgba(255,255,255,.45), rgba(111,91,201,.85)); color: #fff; border-color: rgba(255,255,255,.55); box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 4px 14px rgba(111,91,201,.35); }
.diag-card .btn:not(.green):not(.icon-btn) { background: linear-gradient(160deg, rgba(255,255,255,.8), rgba(47,150,105,.2)); color: #1a5a3c; }
.diag-card .btn.green, .dg-dlb { background: linear-gradient(160deg, rgba(255,255,255,.45), rgba(47,150,105,.85)) !important; color: #fff !important; }
.dg-tctl .btn.icon-btn { box-shadow: none; }

.zoom-controls button, .nav-btns button {
  background: radial-gradient(120% 70% at 25% -5%, rgba(255,255,255,.95), rgba(255,255,255,0) 58%), linear-gradient(160deg, rgba(70,140,215,.16), rgba(70,140,215,.36));
  border: 1px solid rgba(255,255,255,.85); box-shadow: 0 1.5px 1px #fff inset, 0 -8px 12px rgba(70,140,215,.18) inset, 0 0 0 .5px rgba(70,140,215,.3), 0 4px 12px rgba(70,140,215,.2);
  backdrop-filter: blur(14px) saturate(2); -webkit-backdrop-filter: blur(14px) saturate(2);
}
.pdf-toolbar .btn.grey { background: radial-gradient(120% 70% at 25% -5%, rgba(255,255,255,.95), rgba(255,255,255,0) 58%), linear-gradient(160deg, rgba(111,91,201,.16), rgba(111,91,201,.36)); }
.roster-header .btn.green, .btn.green { background: radial-gradient(120% 70% at 25% -5%, rgba(255,255,255,.6), rgba(255,255,255,0) 58%), linear-gradient(160deg, rgba(111,91,201,.75), rgba(111,91,201,.95)); box-shadow: 0 1.5px 1px rgba(255,255,255,.7) inset, 0 6px 16px rgba(111,91,201,.4); }

/* =====================================================
   FINAL: flat pastel buttons, no glass. One pastel per function. Bold, centred icons.
   lilac = view / main, peach = timer, blue = class + navigation, green = diagnostics + data, grey = account / quiet
   ===================================================== */
:root { --pb: #e0d9f8; --pbh: #d3c9f4; --pi: #3b2f7a; }
.btn, .nc-btn, .tab, .mode-opt, .zoom-controls button, .nav-btns button, .dg-go, #start-btn, #dg-fab, #l-submit, .join-card button#join-btn {
  background: var(--pb) !important; color: var(--pi) !important; border: 0 !important; box-shadow: none !important;
  backdrop-filter: none !important; -webkit-backdrop-filter: none !important; background-image: none !important; text-shadow: none;
}
.btn:hover, .nc-btn:hover, .tab:hover, .mode-opt:hover, .zoom-controls button:hover, .nav-btns button:hover, .dg-go:hover, #start-btn:hover, #dg-fab:hover { background: var(--pbh) !important; transform: none; filter: none; }
.btn:active, .tab:active, .mode-opt:active { transform: scale(.96); }
.btn:disabled { opacity: .45; }
.btn::before, .btn::after, .tab::after, .mode-opt::before, .mode-opt::after { content: none !important; }
.tabs #t-reset::before { content: '\21BA' !important; }

/* per function */
.rail-grp.g-view, .rail-grp.g-mode { --pb: #e0d9f8; --pbh: #d3c9f4; --pi: #3b2f7a; --pa: #b9a8ee; }
.rail-grp.g-time { --pb: #ffe2cc; --pbh: #ffd5b8; --pi: #7a3f22; --pa: #ffb98a; }
.rail-grp.g-class, .pdf-toolbar, .roster-header, .zoom-controls, .nav-btns { --pb: #d4e6f8; --pbh: #c3dcf4; --pi: #1f4f80; --pa: #a9cdee; }
.rail-grp.g-data, .diag-card, .dg-card { --pb: #d2eddd; --pbh: #c1e5d0; --pi: #1f6b47; --pa: #a6dcbc; }
.rail-grp.g-acct { --pb: #e8e6f0; --pbh: #dcd9e8; --pi: #4a4666; }
.btn.green, .dg-go, #start-btn, #l-submit { --pb: #cbbdf3; --pbh: #bba9ee; --pi: #2d2266; }
.diag-card .btn.green, .dg-dlb { --pb: #a9dec0; --pbh: #96d3b0; --pi: #14573a; }
.rail-grp.g-time .btn.green { --pb: #ffc79e; --pbh: #ffb98a; --pi: #6a3414; }
.btn.grey, .pdf-toolbar .btn.grey { --pb: #e8e6f0; --pbh: #dcd9e8; --pi: #4a4666; }
.diag-card .btn.icon-btn, .dg-tctl .btn.icon-btn { --pb: #e8e6f0; --pi: #3a3658; }
/* selected state = a deeper pastel */
.tab.active, .tab[data-tab="students"].active, .tabs .mode-opt.active, .tabs .mode-toggle.solo .mode-opt.active { background: var(--pa, #b9a8ee) !important; color: var(--pi) !important; }
.tabs .mode-toggle.solo .mode-opt.active { --pa: #a6dcbc; --pi: #14573a; }
.tab.active .ic, .tabs .mode-opt.active .ic { color: var(--pi); }
.tab:not(.active), .tabs .mode-opt:not(.active) { background: transparent !important; }
.rail-grp .tab:not(.active), .rail-grp .mode-opt:not(.active) { background: var(--pb) !important; }
.rail-grp.g-view .tab.active, .rail-grp.g-mode .mode-opt.active { background: var(--pa) !important; }
.rail-grp.g-time .timer-clock { background: #fff6ee; color: #7a3f22; }

/* rail: same size everywhere, flat */
.rail-grp .btn, .rail-grp .tab, .rail-grp .mode-opt, .tabs .timer-wrap .btn.icon-btn, .tabs .timer-wrap .btn.green, .tabs #t-reset { width: 44px; height: 38px; border-radius: 12px; padding: 0; display: flex; align-items: center; justify-content: center; }
.tabs .tab-group, .tabs .mode-toggle { background: transparent; border: 0; }

/* icons: bold, clear, dead centre */
.ic { stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.rail-grp .ic { width: 21px; height: 21px; display: block; margin: 0; vertical-align: baseline; }
.rail-grp .btn, .rail-grp .tab, .rail-grp .mode-opt { line-height: 0; }
.rail-grp .timer-wrap .btn.icon-btn { font-size: 20px; font-weight: 700; line-height: 1; }
.rail-grp .tab .tab-count { background: #fff; color: var(--pi); }
.btn .ic, .nc-btn .ic { vertical-align: -.22em; }
.rail-actions #signout { box-shadow: none !important; }
.dg-tabs .dg-tab[class*="tc-"].on, .dg-tabs .dg-tab.on { background: #fff !important; color: var(--pi) !important; box-shadow: 0 1px 3px rgba(30,20,80,.14) !important; }
.dg-tabs .dg-tab { background: transparent !important; }

/* fixes: flat New diagnostic button, readable play icon, rail fits 800px */
.dg-dlb, .diag-card .btn.green, .dg-deploy .btn { background-image: none !important; background-color: var(--pb) !important; color: var(--pi) !important; box-shadow: none !important; border: 0 !important; }
.rail-grp .btn .ic, .rail-grp .tab .ic, .rail-grp .mode-opt .ic { color: var(--pi) !important; }
.rail-grp .tab:not(.active) .ic, .rail-grp .mode-opt:not(.active) .ic { color: var(--pi) !important; }
.rail-grp .btn, .rail-grp .tab, .rail-grp .mode-opt, .tabs .timer-wrap .btn.icon-btn, .tabs .timer-wrap .btn.green, .tabs #t-reset { height: 34px; }
.tabs { gap: 8px; padding: 8px 7px; }
.tabs > .rail-grp + .rail-grp, .rail-actions > .rail-grp { padding-top: 8px; }
.nav-btns { display: none !important; }

/* ---- continuous booklet: pages joined in one scroll ---- */
.pv-host { margin: 0 auto; width: max-content; padding: 6px 0; }
.pv-page { position: relative; background: #fff; border-radius: 6px; margin-left: auto; margin-right: auto; box-shadow: 0 0 0 6px rgba(255,255,255,.42), 0 0 0 7px rgba(255,255,255,.95), 0 14px 40px rgba(70,50,140,.2); }
.pv-page canvas { display: block; width: 100%; height: 100%; border-radius: 6px; }
#canvas-wrapper { overflow: visible !important; box-shadow: none !important; border-radius: 0 !important; }
#pdf-render, #student-canvas { display: none !important; }

/* FEATHERED PAGES: page edges melt into the glass */
.pv-page { background: transparent !important; box-shadow: none !important; border-radius: 0 !important; }
.pv-page canvas { border-radius: 0 !important;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%), linear-gradient(to bottom, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%), linear-gradient(to bottom, transparent 0, #000 18px, #000 calc(100% - 18px), transparent 100%);
  -webkit-mask-composite: source-in; mask-composite: intersect; }

/* ONLY THE BOOKLET ZOOMS */
html, body { touch-action: pan-x pan-y; }

/* ===== STUDENT RAIL: same layout as the teacher (floating logo, icon rail on the left, pop-outs) ===== */
#viewer-container { flex-direction: row !important; gap: 10px !important; padding: 10px !important; }
.top-bar, .sub-bar { display: none !important; }
.s-rail { flex: none; width: 64px; box-sizing: border-box; padding: 10px 7px; display: flex; flex-direction: column; align-items: center; gap: 8px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none;
  background: rgba(255,255,255,.5); backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8); border: 1px solid rgba(255,255,255,.85); border-radius: 22px; box-shadow: 0 6px 22px rgba(70,50,140,.1); }
.s-rail::-webkit-scrollbar { display: none; }
.s-rail .s-sep { width: 34px; height: 1px; background: rgba(60,50,100,.12); flex: none; margin: 2px 0; }
.s-main { position: relative; flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.s-main > .canvas-scroll-area { flex: 1; min-height: 0; padding-top: 70px !important; padding-bottom: 30px !important;
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 34px), transparent 100%); mask-image: linear-gradient(to bottom, #000 calc(100% - 34px), transparent 100%); }
.float-brand { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 20; display: inline-flex; align-items: center; padding: 6px 16px 6px 8px; border-radius: 999px;
  background: rgba(255,255,255,.55); backdrop-filter: blur(22px) saturate(1.7); -webkit-backdrop-filter: blur(22px) saturate(1.7); border: 1px solid rgba(255,255,255,.85); box-shadow: 0 6px 22px rgba(70,50,140,.14); pointer-events: none; }
.float-brand .brand-wrap { margin: 0; padding: 0; }
.s-rail .s-btn, .s-rail #mode-pill, .s-rail #dg-fab, .s-rail .me-score, .s-rail .code-chip, .s-rail .timer-pill {
  position: static !important; box-sizing: border-box; width: 46px; min-height: 42px; margin: 0; padding: 0 !important; border: 0 !important; border-radius: 14px !important; display: flex; align-items: center; justify-content: center; flex-direction: column;

  <script type="module">

    const firebaseConfig = {

    let pdfDoc = null;

    /* ---------- class code helpers (must match the teacher page) ---------- */
    const CODE_RE = /^[A-HJ-NP-Z2-9]{6}$/;

    const fromLink = new URLSearchParams(location.search).get('code') || location.hash.replace('#', '');
    let savedCode = '', savedName = '';
    try { savedCode = localStorage.getItem('cf_student_code') || ''; savedName = localStorage.getItem('cf_student_name') || ''; } catch (_) {}
    codeInput.value = cleanCode(fromLink) || cleanCode(savedCode);
    { const m = /^(.*\S)\s+(\S)$/u.exec(savedName); nameInput.value = m ? m[1] : savedName; initialInput.value = m ? m[2] : ''; }
    const classNameEl = document.getElementById('class-name');

      const c = cleanCode(codeInput.value);

    setTimeout(() => {

      const linkCode = cleanCode(fromLink);

        window.joinClass();

    }, 0);

    /* ---------- booklet rendering: one continuous scroll of joined pages ---------- */
    let teacherPage = 1;
    function updatePageUI(num) {
      if (!pdfDoc) return;
      pageLabel.hidden = true;
      pageControls.hidden = false;
      pageTotal.textContent = pdfDoc.numPages;
      pageInput.max = pdfDoc.numPages;

    }
    const scrollArea = document.querySelector('.canvas-scroll-area');
    /* while paused, the page under the blur never moves, whatever else happens (a booklet reload, a layout change) */
    scrollArea.addEventListener('scroll', () => { if (frozen && (scrollArea.scrollTop !== frozen.t || scrollArea.scrollLeft !== frozen.l)) { scrollArea.scrollTop = frozen.t; scrollArea.scrollLeft = frozen.l; } }, { passive: true });
    const zoomDisplay = document.getElementById('zoom-display');
    const MIN_ZOOM = 1, MAX_ZOOM = 6;
    const MAX_PIXELS = window.matchMedia('(pointer: coarse)').matches ? 16e6 : 28e6;   // phones/tablets have tighter canvas limits
    let zoom = 1;
    const pvHost = document.createElement('div'); pvHost.id = 'pv-pages'; scrollArea.appendChild(pvHost);
    canvas.style.display = 'none';
    const pv = PV({
      area: scrollArea, host: pvHost, gap: 12, minZoom: MIN_ZOOM, maxZoom: MAX_ZOOM, maxPixels: MAX_PIXELS, dprCap: 3,
      onPage: (n) => { if (isSoloWork) { currentPage = n; updatePageUI(n); } },
      onZoom: (z) => { zoom = z; zoomDisplay.textContent = `${Math.round(z * 100)}%`; },
      afterRender: (cv, n, g) => { document.body.classList.remove('ll-loading'); LB.process(cv, n, g); }
    });
    // Teacher leading: the class sees the teacher's page only. Solo work: the whole booklet scrolls.
    function applyMode() {
      if (!pdfDoc || pv.doc !== pdfDoc) return;
      if (isSoloWork) {
        placedOnce = true; frozen = null; const wasLocked = viewLocked; if (wasLocked) matchZoom = true; viewLocked = false; pv.setLock(null);
        /* unlocking resets the scroll to the top of the booklet, so always jump back to the right page (even if it is the one already shown) */
        if (wasLocked || pv.cur !== currentPage) { const jump = () => { if (isSoloWork) { if (matchZoom) { matchZoom = false; zTgt = null; pv.setZoom(teacherZoom); scrollArea.scrollLeft = 0; } if (typeof teacherY === 'number') { scrollArea.scrollTop = teacherY * scrollArea.scrollHeight; if (typeof teacherX === 'number') scrollArea.scrollLeft = teacherX * scrollArea.scrollWidth; } else pv.goTo(currentPage, true); } }; pv.goTo(currentPage, true); requestAnimationFrame(jump); setTimeout(jump, 220); }
      }
      else { pv.setLock(null); if (!placedOnce) { currentPage = teacherPage || currentPage; placedOnce = true; pv.goTo(currentPage, true); } viewLocked = true; if (!frozen) frozen = { t: scrollArea.scrollTop, l: scrollArea.scrollLeft }; }   /* paused: nothing moves; the blur covers the page where the student left it */   /* paused: the page underneath the blur stays put */
      updatePageUI(currentPage);
    }
    // In solo work, students can type a page number and press Enter
    function goToTypedPage() {
      if (!isSoloWork || !pdfDoc) { updatePageUI(currentPage); return; }
      let n = Math.floor(Number(pageInput.value));
      if (!Number.isFinite(n)) n = currentPage;
      n = Math.min(pdfDoc.numPages, Math.max(1, n));
      pageInput.value = n;
      if (n !== currentPage) { currentPage = n; pv.goTo(n, true); }
    }
    pageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { goToTypedPage(); pageInput.blur(); } });
    pageInput.addEventListener('change', goToTypedPage);
    pageInput.addEventListener('focus', () => pageInput.select());


    /* smooth zoom: gestures set a target; one eased step is applied per frame (keeps trackpads and fingers fluid) */
    let zTgt = null, zAnc = [null, null], zSm = false, zRaf = 0;
    function zStep() {
      zRaf = 0; if (zTgt == null) return;
      const cur = pv.zoom, d = zTgt - cur, n = (zSm && Math.abs(d) > .004) ? cur + d * .3 : zTgt;
      pv.setZoom(n, zAnc[0], zAnc[1]);
      if (n !== zTgt && Math.abs(zTgt - pv.zoom) > .002) zRaf = requestAnimationFrame(zStep); else zTgt = null;
    }
    function setZoom(z, cx, cy, smooth) { zTgt = z; zAnc = [cx, cy]; zSm = !!smooth; if (!zRaf) zRaf = requestAnimationFrame(zStep); }
    const zNow = () => (zTgt != null ? zTgt : pv.zoom);
    window.zoomBy = (f) => setZoom(zNow() * f, null, null, true);

    /* Safari trackpad pinch (gesture events), booklet area only */
    (function (el) {
      let z0 = 1;
      el.addEventListener('gesturestart', (e) => { e.preventDefault(); z0 = zoom; });
      el.addEventListener('gesturechange', (e) => { e.preventDefault(); setZoom(z0 * e.scale, e.clientX, e.clientY); });
    })(scrollArea);
    /* pinch to zoom on touch screens (booklet area only) */
    (function (el) {
      let d0 = 0, z0 = 1;
      const dist = (t) => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
      el.addEventListener('touchstart', (e) => { if (e.touches.length === 2) { d0 = dist(e.touches); z0 = zoom; } }, { passive: true });
      el.addEventListener('touchmove', (e) => {
        if (e.touches.length !== 2 || !d0) return;
        e.preventDefault();
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;

      el.addEventListener('touchend', (e) => { if (e.touches.length < 2) d0 = 0; }, { passive: true });

      if (!isSoloWork || !pdfDoc) return;

      if (n !== currentPage) { currentPage = n; pv.goTo(n, true); updatePageUI(n); }
    };

    let loadSeq = 0, loadTries = 0, lastPdfKey = '';
    function loadBase64PDF(base64Data) {
      const seq = ++loadSeq;
      waitingMsg.style.display = ''; if (!pdfDoc) waitingMsg.textContent = 'Loading booklet…';
      document.body.classList.add('ll-loading'); setTimeout(() => document.body.classList.remove('ll-loading'), 20000);
      try {
        LB.reset();
        const raw = atob(base64Data);
        const array = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) array[i] = raw.charCodeAt(i);
        pdfjsLib.getDocument({ data: array }).promise.then(async (doc) => {
          try { const m = await doc.getMetadata(); window.__lbSimple = !!(m && m.info && m.info.Subject === 'lessonlab-merged'); } catch (_) { window.__lbSimple = false; }
          if (seq !== loadSeq) return;   // a newer booklet arrived meanwhile
          pdfDoc = doc; loadTries = 0;
          waitingMsg.style.display = 'none';
          pv.setDoc(doc, currentPage).then(applyMode);
        }).catch((err) => { if (seq === loadSeq) loadFailed(err); });
      } catch (err) { loadFailed(err); }
    }
    function loadFailed(err) {
      if (pdfDoc) return;
      waitingMsg.style.display = '';
      waitingMsg.textContent = 'Couldn\u2019t load the booklet (' + ((err && err.message) || 'error') + '). Trying again…';
    }

    /* ---------- joining ---------- */
    let ended = false;
    let studentRef = null;

    function endSession(title, msg) {
      if (ended) return;
      ended = true;
      try { localStorage.removeItem('cf_student_auto'); } catch (_) {}
      // don't leave a nameless "ghost" record behind when this tab closes later
      if (studentRef) onDisconnect(studentRef).cancel().catch(() => {});
      document.getElementById('ended-title').textContent = title;
      document.getElementById('ended-msg').textContent = msg;
      document.getElementById('ended').style.display = 'flex';
    }

    class UserError extends Error {}

    window.llSignOut = async function () {

<script>
/* Lessonlab theme switch: Light / Dark / Auto (follows the device) */
(function () {
  const root = document.documentElement, mq = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
  const ICON = {
    auto: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" style="fill:currentColor"/></svg>',
    light: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6L7 7M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
    dark: '<svg class="ic" viewBox="0 0 24 24"><path d="M19.5 14.5A8 8 0 0 1 9.5 4.5a8 8 0 1 0 10 10z"/></svg>'
  };
  const NAME = { auto: 'Auto', light: 'Light', dark: 'Dark' };
  const get = () => { try { return localStorage.getItem('ll-theme') || 'auto'; } catch (_) { return 'auto'; } };
  function apply(p) {
    const d = p === 'dark' || (p === 'auto' && mq && mq.matches);
    root.setAttribute('data-ll', d ? 'dark' : 'light'); root.setAttribute('data-ll-pref', p);
    const b = document.getElementById('ll-theme'); if (b) { b.innerHTML = ICON[p]; b.title = 'Appearance: ' + NAME[p]; b.setAttribute('aria-label', b.title); }
    const f = document.getElementById('ll-theme-fab'); if (f) { f.innerHTML = ICON[p]; f.title = 'Appearance: ' + NAME[p]; f.setAttribute('aria-label', f.title); }
  }
  function set(p) { try { localStorage.setItem('ll-theme', p); } catch (_) {} apply(p); }
  if (mq) (mq.addEventListener ? mq.addEventListener('change', () => apply(get())) : mq.addListener && mq.addListener(() => apply(get())));
  window.llSetTheme = set;

  /* one click changes the mode: Auto, then Light, then Dark */
  const cycle = () => set({ auto: 'light', light: 'dark', dark: 'auto' }[get()] || 'auto');
  let tries = 0;
  (function place() {
    const so = document.getElementById('signout');
    if (!so || !so.parentNode) { if (tries++ < 60) setTimeout(place, 100); return; }
    if (document.getElementById('ll-theme')) return;
    const b = document.createElement('button'); b.type = 'button'; b.id = 'll-theme';
    b.className = so.className.replace(/\bs-signout\b/, 'll-theme');
    so.parentNode.insertBefore(b, so); b.addEventListener('click', (e) => { e.stopPropagation(); cycle(); });
    apply(get());
  })();
  /* on sign-in / welcome screens the side rail is hidden, so a small corner button stands in for it */
  const fab = document.createElement('button'); fab.type = 'button'; fab.id = 'll-theme-fab'; fab.style.display = 'none'; document.body.appendChild(fab);
  fab.addEventListener('click', (e) => { e.stopPropagation(); cycle(); });
  const syncFab = () => { const b = document.getElementById('ll-theme'); fab.style.display = (b && b.offsetWidth > 0) ? 'none' : 'flex'; };
  setInterval(syncFab, 700); syncFab();
  apply(get());
})();
</script>
